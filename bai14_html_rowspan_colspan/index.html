<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Rowspan-Colspan | Gộp hàng và cột</title>
<!--  -->
  <style>
   table {
     width: 50%;
     border-collapse: collapse;
   }
   td, th {
     border: 1px solid #dddddd;
     /* text-align: left; */
     text-align: center;
     padding: 15px;
   }
   tr:nth-child(odd) { background-color: rgb(26, 144, 107); }
   tr:nth-child(even) { background-color: rgb(232, 179, 44); }
 </style>
<!--  -->
</head>
<body>
  <h3 style="font-size: 25px; color: tomato;">Table Colspan:</h3>
  <table>
   <tr>
     <th colspan="2">Name</th>
     <th>Email</th>
   </tr>
   <tr>
     <td style="width:10px;">Tap</td>
     <td style="height:50px;">Dev</td>
     <td>tapdev.official@gmail.com</td>
   </tr>
 </table>
 <br>
 <h3 style="font-size: 25px; color: tomato;">Table Rowspan:</h3>
 <table>
  <tr>
    <th>Name</th>
    <td>Cao Ngoc Huynh</td>
    <td>Nguyen Trong Phuc</td>
  </tr>
  <tr>
    <th rowspan="2">Email</th>
    <td>caongochuynh19@gmail.con</td>
    <td>nguyentrongphuc09@gmail.com</td>
  </tr>
  <tr>
    <!-- <th>Email</th> -->
    <td>caongochuynh07@gmail.con</td>
    <td>nguyentrongphuc05@gmail.com</td>
  </tr>
  <tr>
    <th>Age</th>
    <td>23</td>
    <td>23</td>
  </tr>
  
 </table>
</body>
</html>
