<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Checkbox - Radio</title>
</head>
<body>
  <!-- 
  Checkbox dùng để chọn nhiều giá trị. (lưu ý tất cả phải cùng name)
  Radio dùng để chọn duy nhất một trong nhiều giá trị (lưu ý tất cả phải cùng name)
  -->

  <form>
    <label>Gender:</label>
    <br>
    <input type="radio" name="gender" value="male" checked>Male<br>
    <input type="radio" name="gender" value="female">Female
    <br><br>

    <label>Hobbies:</label>
    <br>
    <input type="checkbox" name="hobby" value="music">Music<br>
    <input type="checkbox" name="hobby" value="sports" checked>Sports<br>
    <input type="checkbox" name="hobby" value="reading" checked>Reading
    <br><br>
    <button type="submit">Send</button>
 </form>

</body>
</html>
