<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Text Color</title>
    <!--  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
    <!--  -->
    <style>
        p{
            font-size: 20px;
            font-family: "Comic Relief", system-ui;
            font-weight: bold;
            font-style: italic;
            text-align: center;
            text-transform: capitalize;
            line-height: 20px;
            /* color */
            color: blueviolet;
            /* opacity: độ mờ chạy từ 0->1 càng dần về 0 sẽ càng mờ */
            /* opacity: 0.5; */
            /* background: linear-gradient(to right, blueviolet, lightblue); */
            background: linear-gradient(to left, blueviolet, lightblue);
            /* background: radial-gradient(ellipse, lightblue, blueviolet); */
        }
    </style>
</head>
<body>
    <p>text color 1</p>
    <p style="color: brown;">text color 2</p>
    <p style="color: rgba(70, 185, 216, 0.5);">text color 3</p>
    <p style="color: rgb(70, 185, 216);">text color 4</p>
    <p style="color: hsl(296, 93%, 65%);">text color 5</p>
    
</body>
</html>
