<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Input File Upload</title>
</head>
<body>
   <form action="./uploads" method="POST" enctype="multipart/form-data">
     <label>Avatar:</label><br>
     <!-- chú ý đoạn này -->
     <input type="file" name="avatar" accept="image/*" multiple><br><br>
     <!-- enctype="multipart/form-data": bắt buộc khi gửi file.
          accept="image/*": giới hạn chỉ cho chọn hình ảnh. 
      -->
     <button type="submit">Upload</button>
   </form>
</body>
</html>
