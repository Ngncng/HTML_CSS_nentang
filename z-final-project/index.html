<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Resume</title>
    <link
      rel="shortcut icon"
      href="./assets/ico/icon-2.jpg"
      type="image/x-icon"
    />

    <!-- 
    * rel="stylesheet": cho trình duyệt biết đây la một file thiết kế giao diện css
    
    * intergrity: một mã khóa bảo mật. Trình duyệt dựa vào mã này để kiểm tra xem file tải từ CDN về 
    có bị ai sửa đổi, chèn mã độc hay không.
    
    * crossorigin="annonymous": yêu cầu trình lấy dữ liệu về một cách ẩn danh, nghĩa là 
    không mang theo cookie, mật khẩu hay thông tin gì khác của người dùng. Đại loại là bảo vệ thông tin của bạn
    
    * referrerpolicy="no-referrer": không cho trình duyệt tiết lộ với máy chủ tài nguyên, là bạn đang đứng từ 
    trang web nào trong lúc tải file dữ liệu về. 
    -->

    <!-- Sử dụng 2 bộ icon phổ biến là font-awesome và devicon  -->
    <!-- font-awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- devicon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/devicon/2.17.0/devicon.min.css"
      integrity="sha512-6/05LVs+grXBAu5XzdiMFB64yCVF9FL70zWrTKcaTEKygrO7fC5LqfL/SKPpuRpimL2aE0D7Hw/NoED+7+7/VQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- gg-font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <!-- file css chính của chúng ta: index.css -->
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <div class="resume-container">

      <header class="header">
         <!-- bubble-left -->
        <div class="bubble-left">
          <div class="hello-text">Hello there,</div>
          <div class="contact-info">
            <!-- SĐT -->
            <p>
              <i class="fas fa-mobile-alt"></i>
              <a href="tel:0123456789">
                0123456789
              </a>
            </p>

          <!--
            rel="noopener noreferrer": với exterrnal link target _blank, thì rel này sẽ 
            ngăn chặn lỗ hỏng bảo mật liên quan đến tab lừa đảo (window.opener)
            đồng thời ẩn thông tin nguồn (Referrer) để bảo mật cho trang web của mình
          -->
            <p>
              <i class="fas fa-map-marker-alt"></i>
              <a href="https://maps.app.goo.gl/i364DGSWY8as1Mba6" target="_blank" rel="noopener noreferrer">
                Hanoi, Vietnam
              </a>
            </p>

            <!-- Github -->
            <p>
              <i class="fas fa-globe"></i>
              <a href="https://github.com/Ngncng/" target="_blank" rel="noopener noreferrer">
                Github
              </a>
            </p>

            <!-- Mail -->
            <p>
              <i class="fas fa-envelope"></i>
              <a href="mailto:obito060523@gmail.com" target="_blank" rel="noopener noreferrer">obito060523@gmail.com</a>
            </p>
          </div>
        </div>

        <!-- Avatar -->
         <div class="avatar">
            <img src="./assets/img/icon-2.jpg" alt="Hoclaptrinh">
         </div>

         <!-- bubble-right -->
          <div class="bubble-right">
            <div class="im-text">i'm Hoclaptrinh</div>
            <div class="first-job">Developer</div>
            <div class="second-job">Student</div>
            <div class="third-job">Upcoming...</div>

          </div>
      </header>

      <main class="main-content">
        <div class="col-left"></div>
        <div class="col-right"></div>
      </main>

      <!-- <footer class="footer"></footer> -->
    </div>
  </body>
</html>
