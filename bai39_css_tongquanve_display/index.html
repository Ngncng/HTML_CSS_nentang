<body>
    <!-- 
    Với 2 kiểu display Flex và Grid:
    Flex: Sắp xếp layout (1D - 1 chiều) theo chiều ngang hoặc dọc một cách linh hoạt.
    Grid: Sắp xếp layout dạng lưới (2D - 2 chiều) theo cả 2 chiều ngang và dọc cùng lúc.
	Riêng kiểu display None: Ẩn luôn phần tử khỏi layout (không bị chiếm diện tích trên màn hình)
    -->
</body>
</html>
