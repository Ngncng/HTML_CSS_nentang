<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Responsive</title>
  <style>
    .hoclaptrinh{
      width: 300px;
      height: 300px;
      color: chocolate;
      background-color:cadetblue;
      margin: 0 auto;
    }
    /* sm */
    @media screen and (min-width: 640px) {
      .hoclaptrinh{
        width: 600px;
        background-color: aquamarine;
      }
     }

     /* lg */
     @media screen and (min-width: 1024px) {
      .hoclaptrinh{
        width: 900px;
        background-color: burlywood;
      }
     }


    /* @media screen and (max-width: 700px) { } */

  </style>
</head>
<body>
  <!-- Responsive hiểu đơn giản là 
   cách mà chúng ta làm cho trang web hiển thị đẹp + phù hợp trên mọi thiết bị như 
   Desktop - Tablet - Mobile -->
   <div class="hoclaptrinh">
    Nội dung div hoclaptrinh
   </div>
</body>
</html>
