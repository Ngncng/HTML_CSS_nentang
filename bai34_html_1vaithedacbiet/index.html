<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TML - Một vài thẻ đặc biệt </title>
</head>
<body>
  <!-- summary: Thẻ này nằm trong thẻ details, khi click vào sẽ đóng/mở nội dung bên trong.
  Thuộc tính open: mặc định khi vào trang là sẽ mở danh sách luôn.
 -->
  <details>
    <summary>chi tiết đơn hàng:</summary>
    <p>- Sản phẩm: Apple Magic Mouse 3 Black</p>
    <p>- Giá: 2.000.000 VNĐ</p>
    <p>- Ngày giao hàng: 09/09/2026</p>
  </details>
  <hr>

  <!-- 
  value: Giá trị hiện tại.
  max: Giá trị tối đa của thanh progress.
  -->
  <details open>
    <label>Đang tải dữ liệu:</label>
    <progress value="70" max="100"></progress>
  </details>
  <hr>

  <!-- 
  value: Giá trị hiện tại.
  min: Giá trị tối thiểu của thanh progress.
  max: Giá trị tối đa của thanh progress.
  low: Ngưỡng thấp nhất của thanh progress, khi dưới ngưỡng này sẽ đổi màu.
  high: Ngưỡng cao nhất của thanh progress, khi vượt ngưỡng này sẽ đổi màu.
  optimum: Ngưỡng giá trị lý tưởng nhất của thanh progress.
  Lưu ý: Màu sắc mặc định của thanh đo có thể sẽ khác nhau tùy theo trình duyệt.
  -->
  <details>
      <meter value="70" 
             min="0" 
             max="100" 
             low="40" 
             high="80"
             optimum="60"
             >
      </meter>
  </details>
</body>
</html>
