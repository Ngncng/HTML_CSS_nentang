<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Table - Tạo Bảng</title>
  <!--  -->
  <style>
   table {
     width: 50%;
     border-collapse: collapse;
   }
   td, th {
     border: 1px solid #dddddd;
     /* text-align: left; */
     text-align: center;
     padding: 15px;
   }
   tr:nth-child(odd) { background-color: yellowgreen; }
   tr:nth-child(even) { background-color: goldenrod; }
 </style>
 <!--  -->
</head>
<body>
  <table>
    <tr>
      <th>STT</th>
      <th>Name</th>
      <th>Age</th>
    </tr>
    <!--  -->
    <tr>
      <td>1</td>
      <td>Cao Ngoc Huynh</td>
      <td>22</td>
    </tr>
    <!--  -->
    <tr>
      <td>2</td>
      <td>Nguyen Trong Phuc</td>
      <td>22</td>
    </tr>
  </table>
</body>
</html>
