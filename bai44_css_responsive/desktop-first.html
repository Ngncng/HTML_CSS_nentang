<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop-First</title>
    <style>
      /* 1. CSS ban đầu cho PC (Màn hình lớn) */
      .container-desktop {
        display: flex;
        gap: 20px;
      }
      .card-item {
        flex: 1;
        background-color: #2ecc71; /* Màu xanh lá */
        padding: 20px;
        text-align: center;
      }
      /*-----------------------------------------------*/
      /* 2. CSS khi co về Mobile (Từ 768px trở xuống) */
      @media (max-width: 768px) {
        .container-desktop {
          flex-direction: column; /* Từ hàng ngang thành hàng dọc */
        }
        .card-item {
          background-color: #e74c3c; /* Màu đỏ */
        }
      }
    </style>
  </head>
  <body>
    <div class="container-desktop">
      <div class="card-item">Card 1</div>
      <div class="card-item">Card 2</div>
      <div class="card-item">Card 3</div>
    </div>
  </body>
</html>
